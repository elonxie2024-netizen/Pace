name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test Pace
        shell: powershell
        run: |
          .\build.ps1
          .\test.ps1

      - name: Build installer
        shell: powershell
        run: .\build-installer.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pace-Windows-Installer
          path: dist/Pace-Setup-*.exe

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          $expected = "v$version"
          if ("${{ github.ref_name }}" -ne $expected) { throw "Tag must be $expected to match version.txt" }
          gh release create $expected "dist/Pace-Setup-$version.exe" --title "Pace $version" --generate-notes
